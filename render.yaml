# Exported from Render.com
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: loop
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
